version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Boot и Spring Cloud обновляются вместе: BOM тянет согласованный набор.
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Базовые образы в Dockerfile (eclipse-temurin).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
