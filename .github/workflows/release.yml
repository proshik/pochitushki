name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            major=0; minor=0; patch=0
          else
            v=${latest#v}
            IFS=. read -r major minor patch <<<"$v"
          fi

          case "${{ inputs.bump }}" in
            patch) patch=$((patch+1));;
            minor) minor=$((minor+1)); patch=0;;
            major) major=$((major+1)); minor=0; patch=0;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Previous: ${latest:-<none>}"
          echo "Next:     $next"

      - name: Create and push tag
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          gh release create "$NEXT" \
            --title "$NEXT" \
            --generate-notes

      # Tags pushed with GITHUB_TOKEN don't trigger workflows (GitHub's
      # infinite-loop guard), so we explicitly dispatch build.yml on the
      # new tag. The job's permissions:actions:write is required for
      # gh workflow run.
      - name: Trigger build for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          gh workflow run build.yml --ref "$NEXT"
