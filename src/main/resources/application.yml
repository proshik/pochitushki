spring:
  application:
    name: pochitushki
  cloud:
    openfeign:
      client:
        config:
          telegram-oidc:
            # Feign идёт по редиректам по умолчанию, и тогда id_token читается
            # оттуда, куда увёл последний хоп. У token-эндпоинта легитимных
            # редиректов не бывает.
            followRedirects: false
  # Ни один запрос не должен висеть на БД дольше этого: без потолка один тяжёлый
  # запрос держит и соединение из пула, и поток Tomcat.
  jdbc:
    template:
      query-timeout: PT30S
  datasource:
    url: jdbc:postgresql://localhost:5432/pochitushki
    username: postgres
    password: postgres
    hikari:
      auto-commit: true
      # 1 секунда — это отказ при первом же всплеске; 3 переживают короткую очередь.
      connection-timeout: 3000
      idle-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 3
      pool-name: main-db-pool
      connection-test-query: SELECT 1
      validation-timeout: 1000
      max-lifetime: 300000
  liquibase:
    change-log: classpath:liquibase/changelog-master.yml

# Lock down Actuator: only health exposed, no detailed health (which can leak
# component/infra info). Sensitive endpoints (env, heapdump, loggers, threaddump) stay disabled.
#
# probes.enabled=true включает /actuator/health/liveness и /actuator/health/readiness вне
# Kubernetes. Различие существенное: readiness включает БД, liveness — нет. Если повесить
# перезапуск на health с БД внутри, падение Postgres превращается в цикл рестартов.
#
# Метрики Prometheus не открыты по умолчанию: реестр в classpath есть, эндпоинт — нет.
# Чтобы снимать их, поднимите порт управления и добавьте эндпоинт (порт наружу не публиковать):
#   MANAGEMENT_SERVER_PORT=8081
#   MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Never leak stack traces / internal messages in error responses.
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  # Behind a reverse proxy / tunnel the app must trust X-Forwarded-Proto,
  # otherwise sendRedirect() absolutizes Location as http:// on an https site.
  forward-headers-strategy: framework
  # Дать доработать начатым запросам при остановке, а не рвать их.
  shutdown: graceful

pdf:
  playwright:
    enabled: false

app:
  security:
    cookie:
      # Secure-атрибут на auth-куках. Дефолт true — fail-safe, прод не должен
      # деградировать из-за забытой переменной. Локально по http нужен false:
      # Safari не принимает Secure-куку с http://localhost (Chrome и Firefox
      # принимают), а с http://192.168.x.x её не принимает никто — то есть
      # с телефона иначе не зайти.
      secure: ${COOKIE_SECURE:true}

telegram:
  # Управляет подключением бота на старте. false => бот не запускается (ни polling, ни webhook),
  # bot-токен не требуется. Вход через Telegram (telegram.oauth.*) работает независимо от этого флага.
  enabled: ${TELEGRAM_ENABLED:true}
  # Optional shared secret validated against the X-Telegram-Bot-Api-Secret-Token header on the
  # webhook. When blank the check is skipped (e.g. polling/dev). Set in production.
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  oauth:
    # base-url и expected-issuer меняются вместе и только осознанно: это и есть
    # переключение на локальный брокер входа (telegram-login-broker), который
    # избавляет от ngrok и походов в BotFather. iss сверяется побайтово, поэтому
    # слэш в конце — уже другой issuer.
    base-url: ${TELEGRAM_OAUTH_BASE_URL:https://oauth.telegram.org}
    expected-issuer: ${TELEGRAM_EXPECTED_ISSUER:https://oauth.telegram.org}
    client-id: ${TELEGRAM_CLIENT_ID}
    client-secret: ${TELEGRAM_CLIENT_SECRET}
    redirect-uri: ${APP_BASE_URL}/auth/telegram/callback

logging:
  level:
    # INFO, а не DEBUG: на DEBUG в лог уезжают URL каждой сохранённой ссылки (история чтения)
    # и тела апдейтов Telegram (тексты сообщений, имена, file_id). Поднять на время отладки:
    # LOGGING_LEVEL_RU_PROSHIK_POCHITUSHKI=DEBUG
    ru.proshik.pochitushki: ${APP_LOG_LEVEL:INFO}

jwt:
  # No default: the app must fail fast if JWT_SECRET is not provided (≥32 bytes, base64).
  secret: ${JWT_SECRET}
  # Short-lived: a stolen/forgotten token (logout can't revoke a stateless JWT) stays valid
  # for at most this long. The auth_token cookie max-age is derived from the same value.
  ttl-days: 1