spring:
  application:
    name: pochitushki
  datasource:
    url: jdbc:postgresql://localhost:5432/pochitushki
    username: postgres
    password: postgres
    hikari:
      auto-commit: true
      connection-timeout: 1000
      idle-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 3
      pool-name: main-db-pool
      connection-test-query: SELECT 1
      validation-timeout: 1000
      max-lifetime: 300000
  liquibase:
    change-log: classpath:liquibase/changelog-master.yml

pdf:
  playwright:
    enabled: false

telegram:
  enabled: true
  oauth:
    base-url: https://oauth.telegram.org
    client-id: ${TELEGRAM_CLIENT_ID}
    client-secret: ${TELEGRAM_CLIENT_SECRET}
    redirect-uri: ${APP_BASE_URL}/auth/telegram/callback

logging:
  level:
    ru.proshik.pochitushki: DEBUG

jwt:
  secret: ${JWT_SECRET}
  ttl-days: 7