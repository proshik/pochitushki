<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} + ' — Почитушки'">Почитушки</title>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">

  <!-- Anti-flash: must run before any paint, so no defer. -->
  <script src="/js/theme-init.js"></script>

  <!-- All assets are served from this origin so the CSP can stay on 'self'
       (see SecurityHeadersFilter). defer keeps document order: htmx is defined
       by the time app.js runs. -->
  <script src="/js/htmx.min.js" defer></script>
  <script src="/js/htmx-ext-json-enc.js" defer></script>
  <script src="/js/app.js" defer></script>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
</head>

<!-- ══ Top bar: logo · nav · add form · theme · account ══ -->
<header th:fragment="topbar(active)" class="top-bar">
  <a href="/" class="logo">Почитушки</a>

  <nav class="nav-links">
    <a href="/" th:classappend="${active == 'feed'} ? 'on'" th:text="#{web.nav.read}">Читать</a>
    <a href="/all" th:classappend="${active == 'all'} ? 'on'" th:text="#{web.nav.all}">Все</a>
    <a href="/archive" th:classappend="${active == 'archive'} ? 'on'" th:text="#{web.nav.archive}">Архив</a>
    <a href="/favorites" th:classappend="${active == 'favorites'} ? 'on'" th:text="#{web.nav.favorites}">Избранное</a>
  </nav>

  <form th:replace="~{fragments/add-post-form :: form}"></form>

  <button type="button" class="icon-btn" data-action="toggle-theme"
          th:attr="aria-label=#{web.theme.toggle}" th:title="#{web.theme.toggle}">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>

  <a th:if="${userInfo != null}" href="/profile" class="avatar"
     th:classappend="${active == 'profile'} ? 'on'"
     th:text="${userInfo.firstName != null ? #strings.substring(userInfo.firstName, 0, 1) : '?'}"
     th:attr="aria-label=#{web.nav.profile}" th:title="#{web.nav.profile}">П</a>

  <a th:if="${userInfo == null}" href="/auth/telegram" class="login-link">
    <span class="tg-dot" aria-hidden="true"></span>
    <span th:text="#{web.nav.login}">Войти</span>
  </a>
</header>

<!-- ══ View mode toggle (list pages) ══ -->
<div th:fragment="viewtoggle" class="view-toggle">
  <button type="button" id="view-list-btn" class="view-btn" data-view-mode="list"
          th:attr="aria-label=#{web.view.list}" th:title="#{web.view.list}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <button type="button" id="view-grid-btn" class="view-btn" data-view-mode="grid"
          th:attr="aria-label=#{web.view.shelf}" th:title="#{web.view.shelf}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/>
      <rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>
    </svg>
  </button>
</div>

<!-- ══ Bottom tabs: mobile-only navigation ══ -->
<nav th:fragment="tabs(active)" class="bottom-tabs">
  <a href="/" th:classappend="${active == 'feed'} ? 'on'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/>
      <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>
    </svg>
    <span th:text="#{web.nav.read}">Читать</span>
  </a>
  <a href="/all" th:classappend="${active == 'all'} ? 'on'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>
    </svg>
    <span th:text="#{web.nav.all}">Все</span>
  </a>
  <a href="/archive" th:classappend="${active == 'archive'} ? 'on'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 4h18v4H3z"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/>
    </svg>
    <span th:text="#{web.nav.archive}">Архив</span>
  </a>
  <a href="/favorites" th:classappend="${active == 'favorites'} ? 'on'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/>
    </svg>
    <span th:text="#{web.nav.favorites}">Избранное</span>
  </a>
  <a href="/profile" th:classappend="${active == 'profile'} ? 'on'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
    </svg>
    <span th:text="#{web.nav.profile}">Профиль</span>
  </a>
</nav>

</html>
