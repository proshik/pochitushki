<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} + ' — Почитушки'">Почитушки</title>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">

  <!-- Anti-flash: apply saved theme before any paint -->
  <script>
    (function () {
      if (localStorage.getItem('pochitushki-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ──
       Replaces the parts of Tailwind's Preflight the markup used to rely on.
       Everything else (links, buttons, inputs, lists) already sets its own
       colours, borders and fonts inline, so nothing more is needed here. */
    *, ::before, ::after { box-sizing: border-box; }
    body { margin: 0; }
    h1, h2, h3, p { margin: 0; font-size: inherit; font-weight: inherit; }
    img, svg { display: block; max-width: 100%; }

    /* ── Palettes ── */
    :root {
      --bg: #F5F0E8; --text: #1A1714; --accent: #C0622A;
      --muted: #8B7355; --border: #DDD5C4;
      --sidebar-bg: #EAE4D8;
    }
    html.dark {
      --bg: #1A1714; --text: #E8E0D0;
      --border: #3A3330; --muted: #8B7B6B;
      --sidebar-bg: #211D1A;
    }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: 'Source Serif 4', Georgia, serif;
      transition: background-color 0.2s, color 0.2s;
    }
    .font-display { font-family: 'Playfair Display', Georgia, serif; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Post card — list mode (default) ── */
    .post-card {
      display: flex; gap: 0.75rem; align-items: flex-start;
      padding-top: 1rem; padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.3s ease-out both;
      animation-delay: calc(var(--card-index, 0) * 60ms);
    }
    .card-list-view { display: contents; }
    .card-grid-view { display: none; }
    .post-card .card-actions {
      display: flex; opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    .post-card:hover .card-actions { opacity: 1; pointer-events: auto; }
    .post-card .delete-confirm {
      display: flex; opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    .post-card.confirming .card-actions { opacity: 0 !important; pointer-events: none !important; }
    .post-card.confirming .delete-confirm { opacity: 1 !important; pointer-events: auto !important; }
    .htmx-added { animation: fadeIn 0.3s ease-out both; }

    /* ── Post card — grid mode ── */
    #post-list.view-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 1rem;
    }
    /* Make intermediate Thymeleaf wrapper divs transparent so .post-card elements
       become direct grid items. :not(.post-card) prevents the rule from matching
       cards inserted directly by HTMX afterbegin (which are already at depth 1). */
    #post-list.view-grid > div:not(.post-card),
    #post-list.view-grid > div:not(.post-card) > div:not(.load-more-sentinel) { display: contents; }
    .view-grid .post-card { display: flex; flex-direction: column; padding: 0; border-bottom: none; }
    .view-grid .card-list-view { display: none; }
    .view-grid .card-grid-view { display: flex; flex-direction: column; flex: 1; }
    .view-grid .card-grid-body { min-height: 5.5rem; flex: 1; display: flex; flex-direction: column; }

    /* ── Action button (ghost style) ── */
    .card-action-btn {
      background: none; border: 1px solid transparent;
      border-radius: 5px; padding: 0.2rem 0.55rem;
      font-size: 0.8rem; color: var(--muted);
      cursor: pointer; font-family: inherit;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }
    .card-action-btn:hover {
      background: var(--border); border-color: var(--border); color: var(--text);
    }

    /* ── Delete confirm ── */
    .delete-confirm {
      align-items: center; gap: 0.5rem; font-size: 0.82rem; color: var(--muted);
    }
    .delete-confirm-yes {
      background: var(--accent); color: white; border: none;
      border-radius: 4px; padding: 0.2rem 0.6rem; font-size: 0.78rem;
      cursor: pointer; font-family: inherit;
    }
    .delete-confirm-no {
      background: none; border: 1px solid var(--border);
      border-radius: 4px; padding: 0.2rem 0.6rem; font-size: 0.78rem;
      cursor: pointer; font-family: inherit; color: var(--muted);
    }

    /* ── Icon rail button ── */
    .rail-btn {
      width: 32px; height: 32px; border-radius: 6px;
      background: none; border: none; cursor: pointer;
      color: #8B7B6B; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: background 0.1s; font-family: inherit;
    }
    .rail-btn:hover, .rail-btn.active { background: #3A3330; color: #E8E0D0; }
    .rail-btn:disabled { opacity: 0.35; cursor: default; }
    .rail-btn:disabled:hover { background: none; }

    /* ── View mode buttons ── */
    .view-btn {
      width: 30px; height: 30px; border-radius: 5px;
      background: none; border: 1px solid transparent;
      cursor: pointer; font-size: 1rem; color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s; font-family: inherit;
    }
    .view-btn.active, .view-btn:hover {
      background: var(--border); border-color: var(--border); color: var(--text);
    }
  </style>

  <script>
    /* ── Add post form — optimistic UI ── */
    function initAddPostForm() {
      var form = document.getElementById('add-post-form');
      if (!form || form._bound) return;
      form._bound = true;

      function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var inp  = document.getElementById('add-post-url');
        var btn  = form.querySelector('button[type=submit]');
        var url  = inp.value.trim();
        if (!url) return;

        inp.disabled = true;
        btn.disabled = true;
        inp.value    = '';

        var domain = url;
        try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch (ex) {}
        var abbr      = esc(domain.substring(0, 2).toUpperCase());
        var domainEsc = esc(domain);

        var tempId   = 'card-optimistic-' + Date.now();
        var tempCard = document.createElement('div');
        tempCard.id        = tempId;
        tempCard.className = 'post-card';
        tempCard.style.opacity = '0.5';
        tempCard.innerHTML =
          '<div class="card-list-view">' +
            '<div style="width:32px;height:32px;flex-shrink:0;border-radius:6px;background:var(--border);' +
                 'display:flex;align-items:center;justify-content:center;">' +
              '<span style="font-size:0.62rem;color:var(--muted);font-family:sans-serif;">' + abbr + '</span>' +
            '</div>' +
            '<div style="flex:1;min-width:0;">' +
              '<span class="font-display" style="font-size:1.05rem;font-weight:600;color:var(--text);' +
                   'display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + domainEsc + '</span>' +
              '<p style="color:var(--muted);font-style:italic;font-size:0.82rem;margin:0.15rem 0 0;">Добавляется…</p>' +
            '</div>' +
          '</div>' +
          '<div class="card-grid-view" style="border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg);width:100%;">' +
            '<div style="aspect-ratio:16/9;background:var(--border);"></div>' +
            '<div class="card-grid-body" style="padding:0.65rem 0.75rem;">' +
              '<span class="font-display" style="font-size:0.88rem;font-weight:600;color:var(--text);' +
                   'display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + domainEsc + '</span>' +
              '<p style="font-size:0.72rem;color:var(--muted);font-style:italic;margin:auto 0 0;">Добавляется…</p>' +
            '</div>' +
          '</div>';

        var postList = document.getElementById('post-list');
        if (postList) postList.insertBefore(tempCard, postList.firstChild);

        fetch('/api/v1/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'url=' + encodeURIComponent(url)
        })
        .then(function (r) {
          if (!r.ok) throw new Error('error');
          return r.text();
        })
        .then(function (html) {
          var temp = document.getElementById(tempId);
          if (!temp) return;
          var wrapper = document.createElement('div');
          wrapper.innerHTML = html.trim();
          var realCard = wrapper.firstElementChild;
          if (realCard) {
            temp.parentNode.replaceChild(realCard, temp);
            if (typeof htmx !== 'undefined') htmx.process(realCard);
            initFavicons(realCard);
            var pl = document.getElementById('post-list');
            if (pl && pl.classList.contains('view-grid')) initOgImages(realCard);
          }
        })
        .catch(function () {
          var temp = document.getElementById(tempId);
          if (temp) temp.remove();
          inp.value = url;
        })
        .finally(function () {
          inp.disabled = false;
          btn.disabled = false;
          inp.focus();
        });
      });
    }

    /* ── Theme ── */
    function toggleTheme() {
      var isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('pochitushki-theme', isDark ? 'dark' : 'sepia');
      var icon = document.getElementById('theme-icon-rail');
      if (icon) icon.textContent = isDark ? '🌙' : '☀️';
    }

    /* ── Delete confirm (CSS class toggle on parent card) ── */
    function showDeleteConfirm(postId) {
      document.getElementById('card-' + postId)?.classList.add('confirming');
    }
    function hideDeleteConfirm(postId) {
      document.getElementById('card-' + postId)?.classList.remove('confirming');
    }

    /* ── Favicon loader ── */
    function initFavicons(root) {
      (root || document).querySelectorAll('.post-favicon[data-url]').forEach(function (el) {
        try {
          var domain = new URL(el.dataset.url).hostname;
          var img = el.querySelector('img');
          var fallback = el.querySelector('.fav-fallback');
          fallback.textContent = domain.replace(/^www\./, '').substring(0, 2).toUpperCase();
          img.src = 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=32';
          img.onload  = function () { img.style.display = 'block'; fallback.style.display = 'none'; };
          img.onerror = function () { img.style.display = 'none'; };
        } catch (e) {}
      });
    }

    /* ── OG image loader (grid mode only) ── */
    function initOgImages(root) {
      (root || document).querySelectorAll('.post-og[data-id]:not([data-og-loaded])').forEach(function (el) {
        el.setAttribute('data-og-loaded', '1');
        var id = el.dataset.id;
        var type = el.dataset.type || 'unread';
        fetch('/api/v1/posts/' + id + '/og-image?type=' + type)
          .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
          .then(function (data) {
            var img = el.querySelector('img.og-img');
            var fallback = el.querySelector('.og-fallback');
            img.src = data.ogImageUrl;
            img.onload = function () {
              img.style.display = 'block';
              if (fallback) fallback.style.display = 'none';
            };
            img.onerror = function () { img.style.display = 'none'; };
          })
          .catch(function () { /* keep fallback visible */ });
      });
    }

    /* ── Favorite toggle (client-side only, no card re-render) ── */
    function toggleFavBtn(btn) {
      btn.closest('.post-card').querySelectorAll('[data-fav-btn]').forEach(function (b) {
        b.textContent = b.textContent.trim() === '☆' ? '⭐' : '☆';
      });
    }

    /* ── View mode ── */
    function setViewMode(mode) {
      var postList = document.getElementById('post-list');
      if (!postList) return;
      postList.classList.toggle('view-grid', mode === 'grid');
      document.getElementById('view-list-btn')?.classList.toggle('active', mode === 'list');
      document.getElementById('view-grid-btn')?.classList.toggle('active', mode === 'grid');
      localStorage.setItem('pochitushki-view', mode);
      document.cookie = 'pochitushki-view=' + mode + '; path=/; max-age=31536000; SameSite=Lax';
      if (mode === 'grid') initOgImages();
    }

    /* ── Infinite scroll ── */
    function initScrollSentinel() {
      var sentinel = document.querySelector('.load-more-sentinel:not([data-sentinel-init])');
      if (!sentinel) return;
      sentinel.setAttribute('data-sentinel-init', '1');

      function doLoad() {
        if (sentinel.dataset.loading) return;
        sentinel.dataset.loading = '1';
        htmx.trigger(sentinel, 'loadMore');
      }

      var observer = new IntersectionObserver(function (entries, obs) {
        if (!entries[0].isIntersecting) return;
        var userScrolled = window.scrollY > 50;
        var pageShort    = document.body.scrollHeight <= window.innerHeight + 100;
        if (userScrolled || pageShort) {
          obs.disconnect();
          doLoad();
        } else {
          /* sentinel is already visible but user hasn't scrolled — wait for real scroll */
          obs.disconnect();
          window.addEventListener('scroll', function onScroll() {
            if (sentinel.getBoundingClientRect().top < window.innerHeight) {
              window.removeEventListener('scroll', onScroll);
              doLoad();
            }
          }, { passive: true });
        }
      }, { threshold: 0.1 });

      observer.observe(sentinel);
    }

    document.addEventListener('DOMContentLoaded', function () {
      var icon = document.getElementById('theme-icon-rail');
      if (icon) icon.textContent = document.documentElement.classList.contains('dark') ? '🌙' : '☀️';
      initFavicons();
      initAddPostForm();
      /* view-grid class is already applied server-side from cookie — only sync button states */
      var postList = document.getElementById('post-list');
      var mode = postList && postList.classList.contains('view-grid') ? 'grid' : 'list';
      document.getElementById('view-list-btn')?.classList.toggle('active', mode === 'list');
      document.getElementById('view-grid-btn')?.classList.toggle('active', mode === 'grid');
      if (mode === 'grid') initOgImages();
      initScrollSentinel();
    });

    document.addEventListener('htmx:afterSwap', function (e) {
      /* For outerHTML swaps the target is already detached; search from its
         parent so the newly inserted element is found. Fall back to document. */
      var root = document.contains(e.detail.target)
        ? e.detail.target
        : (e.detail.target.parentElement || document);
      initFavicons(root);
      var postList = document.getElementById('post-list');
      if (postList && postList.classList.contains('view-grid')) {
        initOgImages(root);
      }
      initScrollSentinel();
    });
  </script>
</head>

<nav th:fragment="nav(active)"
     style="display: flex; flex-shrink: 0;">

  <!-- Dark icon rail (48px) -->
  <div style="width: 48px; height: 100vh; background: #1A1714; position: sticky; top: 0;
              display: flex; flex-direction: column; align-items: center;
              padding: 0.75rem 0; gap: 0.25rem; overflow-y: auto; flex-shrink: 0;">
    <!-- Logo -->
    <a href="/" style="width: 32px; height: 32px; border-radius: 8px; overflow: hidden;
                       display: block; margin-bottom: 0.5rem; text-decoration: none; flex-shrink: 0;">
      <img src="/favicon.svg?v=3" width="32" height="32" alt="Почитушки"></a>
    <!-- Bottom: theme / profile / settings -->
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0.25rem; align-items: center;">
      <button id="theme-icon-rail" class="rail-btn" onclick="toggleTheme()" title="Тема">☀️</button>

      <a href="/profile" class="rail-btn" title="Настройки">⚙️</a>
    </div>
  </div>

  <!-- Text nav (200px) -->
  <div style="width: 200px; height: 100vh; border-right: 1px solid var(--border);
              padding: 1.25rem 1rem; position: sticky; top: 0;
              display: flex; flex-direction: column; background: var(--sidebar-bg);
              overflow-y: auto; flex-shrink: 0;">
    <ul style="list-style: none; padding: 0; margin: 0;
               display: flex; flex-direction: column; gap: 0.1rem; flex: 1;">
      <li>
        <a href="/all"
           th:text="#{web.nav.all}"
           th:style="${active == 'all'}
             ? 'display:flex;align-items:center;padding:0.3rem 0.5rem;border-radius:5px;background:var(--border);color:var(--accent);font-weight:600;text-decoration:none;font-size:0.88rem;'
             : 'display:flex;align-items:center;padding:0.3rem 0.5rem;border-radius:5px;color:var(--text);text-decoration:none;font-size:0.88rem;'">
          Все
        </a>
      </li>
      <li>
        <a href="/"
           th:text="#{web.nav.unread}"
           th:style="${active == 'feed'}
             ? 'display:flex;align-items:center;padding:0.3rem 0.5rem;border-radius:5px;background:var(--border);color:var(--accent);font-weight:600;text-decoration:none;font-size:0.88rem;'
             : 'display:flex;align-items:center;padding:0.3rem 0.5rem;border-radius:5px;color:var(--text);text-decoration:none;font-size:0.88rem;'">
          Непрочитанные
        </a>
      </li>
      <li>
        <a href="/archive"
           th:text="#{web.nav.archive}"
           th:style="${active == 'archive'}
             ? 'display:flex;align-items:center;padding:0.3rem 0.5rem;border-radius:5px;background:var(--border);color:var(--accent);font-weight:600;text-decoration:none;font-size:0.88rem;'
             : 'display:flex;align-items:center;padding:0.3rem 0.5rem;border-radius:5px;color:var(--text);text-decoration:none;font-size:0.88rem;'">
          Архив
        </a>
      </li>
      <li>
        <a href="/favorites"
           th:text="#{web.nav.favorites}"
           th:style="${active == 'favorites'}
             ? 'display:flex;align-items:center;padding:0.3rem 0.5rem;border-radius:5px;background:var(--border);color:var(--accent);font-weight:600;text-decoration:none;font-size:0.88rem;'
             : 'display:flex;align-items:center;padding:0.3rem 0.5rem;border-radius:5px;color:var(--text);text-decoration:none;font-size:0.88rem;'">
          Избранное
        </a>
      </li>
    </ul>
    <!-- User block -->
    <div style="padding-top: 1rem; border-top: 1px solid var(--border);">
      <a th:if="${userInfo != null}" href="/profile"
         style="display:flex; align-items:center; gap:0.5rem; padding:0.4rem;
                text-decoration:none; border-radius:5px;"
         onmouseover="this.style.background='var(--border)'"
         onmouseout="this.style.background='none'">
        <div th:text="${userInfo.firstName != null ? #strings.substring(userInfo.firstName, 0, 1) : '?'}"
             style="width:28px;height:28px;border-radius:50%;background:#5288C1;
                    display:flex;align-items:center;justify-content:center;
                    font-size:0.75rem;font-weight:600;color:white;flex-shrink:0;"></div>
        <div>
          <div th:text="${userInfo.firstName}"
               style="font-size:0.82rem;color:var(--text);"></div>
          <div th:if="${userInfo.username != null and !#strings.isEmpty(userInfo.username)}"
               th:text="'@' + ${userInfo.username}"
               style="font-size:0.72rem;color:var(--muted);"></div>
        </div>
      </a>
      <a th:if="${userInfo == null}" href="/auth/telegram"
         style="display:flex;align-items:center;gap:0.5rem;padding:0.35rem 0.5rem;
                border-radius:5px;background:#2AABEE;color:white;text-decoration:none;
                font-size:0.82rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="white">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.88 13.958l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.268.601z"/>
        </svg>
        <span th:text="#{web.nav.login}">Войти</span>
      </a>
    </div>
  </div>
</nav>

</html>
