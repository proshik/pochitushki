<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout :: head(#{web.page.unread})}"></head>
<body>
<header th:replace="~{layout :: topbar('feed')}"></header>
<main class="page-main">

  <!-- Hero: the oldest saved link — "next to read" -->
  <div th:if="${hero != null}" id="hero" class="hero">
    <div class="hero-stack">
      <a th:replace="~{fragments/post-card :: cover(${hero})}"></a>
    </div>
    <div>
      <div class="eyebrow">
        <span th:text="#{web.hero.next}">Следующая к чтению</span>
      </div>
      <a class="hero-title" th:href="${hero.post.url}" target="_blank" rel="noopener noreferrer"
         ><th:block th:replace="~{fragments/post-card :: title(${hero})}">Title</th:block></a>
      <!-- The hero is the oldest link, so its age always reads as old. -->
      <div class="hero-meta">
        <span th:text="${hero.domain}">site.com</span> · <span class="age old"
          th:title="${hero.age.title}" th:text="${hero.age.text}">лежит 42 дня</span><a
          th:each="label : ${hero.post.labels}" class="label-tag"
          th:href="@{/labels/{id}(id=${label.id})}"
          th:text="'#' + ${label.name}">#label</a>
      </div>
      <div class="hero-actions">
        <a class="btn btn-solid" th:href="${hero.post.url}" target="_blank" rel="noopener noreferrer"
           th:text="#{web.action.read}">Читать</a>
        <button type="button" class="btn btn-ghost"
                th:attr="hx-post=@{/api/v1/posts/{id}/archive(id=${hero.post.id})}"
                hx-swap="none"
                data-archive-undo
                data-reload-on-success
                th:text="#{web.action.toArchive}">В архив</button>
      </div>
    </div>
  </div>

  <div class="page-head">
    <h1 class="eyebrow" th:text="#{web.head.feed(${pageCount})}">На полке · 0</h1>
    <div class="page-head-tools">
      <div th:replace="~{layout :: sorttoggle(${feedSort})}"></div>
      <div th:replace="~{layout :: viewtoggle}"></div>
      <th:block th:replace="~{layout :: kbdhelp(true)}"></th:block>
    </div>
  </div>
  <nav th:replace="~{layout :: labelfilter(${filterBase}, ${filterLabels}, ${filterLabelId}, ${pageCount})}"></nav>
  <div id="post-list" data-reload-on-add th:classappend="${viewMode == 'shelf'} ? 'shelf' : 'list-rows'">
    <div th:replace="~{fragments/post-list :: posts(${covers}, ${pageType}, ${hasMore}, ${viewMode}, ${moreUrl})}"></div>
  </div>
</main>
<nav th:replace="~{layout :: tabs('feed')}"></nav>
</body>
</html>
