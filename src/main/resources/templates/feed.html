<head th:replace="~{layout :: head('Непрочитанные')}"></head>
<body>
<div style="display: flex; min-height: 100vh;">
  <nav th:replace="~{layout :: nav('feed')}"></nav>
  <main style="flex: 1; padding: 2.5rem; max-width: 820px;">
    <h1 class="font-display" style="font-size: 2rem; font-weight: 700; margin-bottom: 2rem;">
      Непрочитанные
    </h1>
    <div th:replace="~{fragments/add-post-form :: form}"></div>
    <div id="post-list">
      <div th:replace="~{fragments/post-list :: posts(${posts}, ${pageType}, ${offset}, ${hasMore})}"></div>
    </div>
  </main>
</div>
</body>
</html>
