<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout :: head(#{web.page.unread})}"></head>
<body>
<header th:replace="~{layout :: topbar('feed')}"></header>
<main class="page-main">

  <!-- Hero: the oldest saved link — "next to read" -->
  <div th:if="${hero != null}" id="hero" class="hero">
    <div class="hero-stack">
      <a th:replace="~{fragments/post-card :: cover(${hero})}"></a>
    </div>
    <div>
      <div class="eyebrow">
        <span th:text="#{web.hero.next}">Следующая к чтению</span><span
          th:if="${heroAgeDays != null and heroAgeDays > 0}"
          th:text="' · ' + #{web.hero.age(${heroAgeDays})}"></span>
      </div>
      <a class="hero-title" th:href="${hero.post.url}" target="_blank" rel="noopener noreferrer"
         th:text="${hero.post.title != null ? hero.post.title : hero.post.url}">Title</a>
      <div class="hero-meta">
        <span th:text="${hero.domain}">site.com</span> ·
        <span th:text="${#temporals.format(hero.post.createdDate, 'dd.MM.yyyy')}">01.01.2026</span><span
          th:each="label : ${hero.post.labels}" class="label-tag"
          th:text="'#' + ${label.name}">#label</span>
      </div>
      <div class="hero-actions">
        <a class="btn btn-solid" th:href="${hero.post.url}" target="_blank" rel="noopener noreferrer"
           th:text="#{web.action.read}">Читать</a>
        <button type="button" class="btn btn-ghost"
                th:attr="hx-post=@{/api/v1/posts/{id}/archive(id=${hero.post.id})}"
                hx-swap="none"
                data-archive-undo
                data-reload-on-success
                th:text="#{web.action.toArchive}">В архив</button>
      </div>
    </div>
  </div>

  <div class="page-head">
    <h1 class="eyebrow" th:text="#{web.head.feed(${pageCount})}">На полке · 0</h1>
    <div th:replace="~{layout :: viewtoggle}"></div>
  </div>
  <div id="post-list" th:classappend="${viewMode == 'shelf'} ? 'shelf' : 'list-rows'">
    <div th:replace="~{fragments/post-list :: posts(${covers}, ${pageType}, ${offset}, ${hasMore}, ${viewMode})}"></div>
  </div>
</main>
<nav th:replace="~{layout :: tabs('feed')}"></nav>
</body>
</html>
