<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Архив')}"></head>
<body>
<div style="display: flex; min-height: 100vh;">
  <nav th:replace="~{layout :: nav('archive')}"></nav>
  <main style="flex: 1; padding: 2.5rem; min-width: 0;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
      <h1 class="font-display" style="font-size: 2rem; font-weight: 700;" th:text="#{web.page.archive}">Архив</h1>
      <div style="display: flex; gap: 0.25rem;">
        <button id="view-list-btn" class="view-btn" onclick="setViewMode('list')" title="Список">☰</button>
        <button id="view-grid-btn" class="view-btn" onclick="setViewMode('grid')" title="Сетка">⊞</button>
      </div>
    </div>
    <div id="post-list">
      <div th:replace="~{fragments/post-list :: posts(${posts}, ${pageType}, ${offset}, ${hasMore})}"></div>
    </div>
  </main>
</div>
</body>
</html>
