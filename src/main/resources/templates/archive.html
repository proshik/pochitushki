<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout :: head(#{web.page.archive})}"></head>
<body>
<header th:replace="~{layout :: topbar('archive')}"></header>
<main class="page-main">
  <div class="page-head">
    <h1 class="eyebrow" th:text="#{web.head.archive(${pageCount})}">В архиве · 0</h1>
    <div th:replace="~{layout :: viewtoggle}"></div>
  </div>
  <div id="post-list" th:classappend="${viewMode == 'shelf'} ? 'shelf' : 'list-rows'">
    <div th:replace="~{fragments/post-list :: posts(${covers}, ${pageType}, ${offset}, ${hasMore}, ${viewMode})}"></div>
  </div>
</main>
<nav th:replace="~{layout :: tabs('archive')}"></nav>
</body>
</html>
