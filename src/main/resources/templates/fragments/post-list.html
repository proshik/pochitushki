<!DOCTYPE html>
<!-- src/main/resources/templates/fragments/post-list.html -->
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Parameters:
    posts    : List<PostData>
    pageType : "unread" | "archive" | "favorites"  (used for scroll trigger URL)
    offset   : Int  (next offset to load)
    hasMore  : Boolean
-->
<div th:fragment="posts(posts, pageType, offset, hasMore)">

  <!-- Post cards — card type is derived from post.isArchived, never "favorites" -->
  <div th:each="post, iter : ${posts}"
       th:style="'--card-index: ' + ${iter.index}">
    <div th:replace="~{fragments/post-card :: card(${post}, ${post.isArchived ? 'archive' : 'unread'})}"></div>
  </div>

  <!-- Infinite scroll trigger — only if more posts exist (guard against empty list with bad hasMore) -->
  <div th:if="${hasMore and !posts.isEmpty()}"
       th:attr="hx-get=@{/api/v1/posts/fragment(type=${pageType},offset=${offset})}"
       hx-trigger="revealed"
       hx-target="#post-list"
       hx-swap="beforeend"
       hx-on--after-request="if(event.detail.successful) this.remove()"
       style="padding: 1rem; text-align: center; color: var(--muted); font-size: 0.9rem;">
    <span th:text="#{web.list.loading}">Загрузка...</span>
  </div>

  <!-- Empty state -->
  <div th:if="${posts.isEmpty()}"
       th:text="#{web.list.empty}"
       style="padding: 3rem 0; text-align: center; color: var(--muted);">
    Список пуст
  </div>

</div>
</html>
