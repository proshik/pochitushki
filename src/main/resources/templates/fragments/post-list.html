<!DOCTYPE html>
<!-- src/main/resources/templates/fragments/post-list.html

  Parameters:
    covers   : List<CoverView>
    pageType : "unread" | "all" | "archive" | "favorites"  (status chips + card actions)
    hasMore  : Boolean
    viewMode : "shelf" | "list"
    moreUrl  : String? — the complete URL of the next page. Built by the controller
               rather than assembled here, so a filtered list (by label) pages through
               its own endpoint instead of silently falling back to /fragment?type=…
-->
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="posts(covers, pageType, hasMore, viewMode, moreUrl)">

  <!-- Card type is derived from post.isArchived, never "favorites"/"all" -->
  <div th:each="cv, iter : ${covers}"
       th:style="'--card-index: ' + ${iter.index}">
    <div th:replace="~{fragments/post-card :: card(${cv}, ${cv.post.isArchived ? 'archive' : 'unread'}, ${viewMode}, ${pageType})}"></div>
  </div>

  <!-- Infinite scroll sentinel — observer managed by initScrollSentinel() in /js/app.js;
       htmx fires on custom 'loadMore' event so IntersectionObserver controls timing -->
  <div th:if="${hasMore and !covers.isEmpty() and moreUrl != null}"
       class="load-more-sentinel"
       th:attr="hx-get=${moreUrl}"
       hx-trigger="loadMore"
       hx-target="#post-list"
       hx-swap="beforeend"
       data-remove-on-success>
    <span th:text="#{web.list.loading}">Загрузка...</span>
  </div>

  <!-- Empty state: an invitation, not an apology -->
  <div th:if="${covers.isEmpty()}" class="empty-state">
    <div class="empty-cover" aria-hidden="true">+</div>
    <h2 th:text="#{web.empty.title}">Полка пуста</h2>
    <p th:text="#{web.empty.text}">Вставьте ссылку в поле сверху или отправьте её боту — обложка появится сама.</p>
  </div>

</div>
</html>
