<!DOCTYPE html>
<!-- src/main/resources/templates/fragments/post-card.html

  Fragments:
    cover(cv)                          — the cover artwork itself (also used by the feed hero)
    card(cv, type, viewMode, pageType) — a full post card: shelf cell or list row
    actions(cv, type, pageType)        — hover/touch action cluster
    confirm(cv, type)                  — delete confirmation overlay

  Parameters:
    cv       : CoverView (post + palette/comp/abbrev/domain, see CoverService)
    type     : "unread" | "archive"    — which table the post lives in
    viewMode : "shelf" | "list"
    pageType : "unread" | "all" | "archive" | "favorites"
-->
<html xmlns:th="http://www.thymeleaf.org">

<!-- ══ Cover artwork ══ -->
<a th:fragment="cover(cv)"
   class="cover" th:classappend="${cv.palette} + ' ' + ${cv.comp}"
   th:href="${cv.post.url}" target="_blank" rel="noopener noreferrer">
  <span class="cover-dom" th:text="${cv.coverDomain}">site.com</span>

  <th:block th:if="${cv.comp == 'co-og'}">
    <!-- Proxied, never hot-linked: keeps the reader's IP off the linked site and
         lets the CSP stay on img-src 'self' (see OgImageProxyService). -->
    <img class="cover-img" alt="" loading="lazy"
         th:src="@{/api/v1/posts/{id}/cover-image(id=${cv.post.id},type=${cv.post.isArchived} ? 'archive' : 'unread')}">
    <span class="cover-strip">
      <span class="cover-t" th:text="${cv.post.title != null ? cv.post.title : cv.post.url}">Title</span>
    </span>
  </th:block>

  <th:block th:if="${cv.comp == 'co-mono'}">
    <span class="cover-big" th:text="${cv.abbrev}">Aa</span>
    <span class="cover-cap" th:text="${cv.post.title != null ? cv.post.title : cv.post.url}">Title</span>
  </th:block>

  <th:block th:if="${cv.comp == 'co-band'}">
    <span class="cover-band" th:text="${cv.post.title != null ? cv.post.title : cv.post.url}">Title</span>
    <span class="cover-cap" th:text="${#temporals.format(cv.post.createdDate, 'dd.MM.yyyy')}">01.01.2026</span>
  </th:block>

  <th:block th:if="${cv.comp == 'co-frame'}">
    <span class="cover-mid" th:text="${cv.post.title != null ? cv.post.title : cv.post.url}">Title</span>
    <span class="cover-cap" th:text="${#temporals.format(cv.post.createdDate, 'dd.MM.yyyy')}">01.01.2026</span>
  </th:block>

  <span th:if="${cv.post.isFavorite}" class="fav-dot" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/>
    </svg>
  </span>
</a>

<!-- ══ Action cluster ══ -->
<div th:fragment="actions(cv, type, pageType)" class="card-actions">
  <!-- Move actions are hidden on the favorites showcase: it is a collection, not a queue. -->
  <button th:if="${type == 'unread' and pageType != 'favorites'}"
          type="button" class="card-action-btn"
          th:attr="hx-post=@{/api/v1/posts/{id}/archive(id=${cv.post.id})},aria-label=#{web.action.toArchive}"
          th:title="#{web.action.toArchive}"
          data-archive-undo
          hx-target="closest .post-card"
          hx-swap="delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 4h18v4H3z"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M12 11v6m0 0-2.5-2.5M12 17l2.5-2.5"/>
    </svg>
  </button>
  <button th:if="${type == 'archive' and pageType != 'favorites'}"
          type="button" class="card-action-btn"
          th:attr="hx-post=@{/api/v1/posts/{id}/unread(id=${cv.post.id})},aria-label=#{web.action.toUnread}"
          th:title="#{web.action.toUnread}"
          hx-target="closest .post-card"
          hx-swap="delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 4h18v4H3z"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M12 17v-6m0 0-2.5 2.5M12 11l2.5 2.5"/>
    </svg>
  </button>
  <button type="button" class="card-action-btn"
          th:classappend="${cv.post.isFavorite} ? 'is-fav'"
          data-fav-btn
          th:attr="hx-post=@{/api/v1/posts/{id}/favorite(id=${cv.post.id},type=${type})},aria-label=#{web.action.favorite},aria-pressed=${cv.post.isFavorite},data-unfav-remove=${pageType == 'favorites'} ? 'true' : null"
          th:title="#{web.action.favorite}"
          hx-swap="none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/>
    </svg>
  </button>
  <button type="button" class="card-action-btn"
          data-action="labels-show"
          th:attr="data-post-id=${cv.post.id},data-post-type=${type},aria-label=#{web.action.labels}"
          th:title="#{web.action.labels}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/>
    </svg>
  </button>
  <button type="button" class="card-action-btn danger"
          data-action="delete-show"
          th:attr="aria-label=#{web.action.delete}"
          th:title="#{web.action.delete}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 .8 12a1 1 0 0 0 1 .9h6.4a1 1 0 0 0 1-.9L17 7"/>
    </svg>
  </button>
</div>

<!-- ══ Label picker ══
     Filled in by initLabelPicker() in /js/app.js on first open: the list of labels is
     per user, not per card, so rendering it into twenty cards server-side would repeat
     the same markup twenty times. -->
<div th:fragment="labelpanel(cv, type)" class="label-panel"
     th:attr="data-post-id=${cv.post.id},data-post-type=${type}"></div>

<!-- ══ Delete confirmation ══ -->
<div th:fragment="confirm(cv, type)" class="delete-confirm">
  <span th:text="#{web.post.delete.confirm}">Удалить?</span>
  <button type="button" class="confirm-yes"
          th:text="#{web.post.delete.yes}"
          th:attr="hx-delete=@{/api/v1/posts/{id}(id=${cv.post.id},type=${type})}"
          hx-target="closest .post-card"
          hx-swap="delete">Да</button>
  <button type="button" class="confirm-no"
          th:text="#{web.post.delete.no}"
          data-action="delete-hide">Нет</button>
</div>

<!-- ══ Post card ══ -->
<div th:fragment="card(cv, type, viewMode, pageType)"
     th:id="'card-' + ${cv.post.id}"
     class="post-card">

  <!-- Shelf cell -->
  <th:block th:if="${viewMode == 'shelf'}">
    <a th:replace="~{fragments/post-card :: cover(${cv})}"></a>
    <a class="cell-title" th:href="${cv.post.url}" target="_blank" rel="noopener noreferrer"
       th:text="${cv.post.title != null ? cv.post.title : cv.post.url}">Title</a>
    <div class="cell-meta">
      <span th:text="${#temporals.format(cv.post.createdDate, 'dd.MM.yyyy')}">01.01.2026</span><a
        th:each="label : ${cv.post.labels}" class="label-tag"
        th:href="@{/labels/{id}(id=${label.id})}"
        th:text="'#' + ${label.name}">#label</a>
    </div>
    <div class="cell-actions">
      <div th:replace="~{fragments/post-card :: actions(${cv}, ${type}, ${pageType})}"></div>
      <div th:replace="~{fragments/post-card :: confirm(${cv}, ${type})}"></div>
      <div th:replace="~{fragments/post-card :: labelpanel(${cv}, ${type})}"></div>
    </div>
  </th:block>

  <!-- List row -->
  <th:block th:if="${viewMode != 'shelf'}">
    <span class="mini-cover" th:classappend="${cv.palette}" th:text="${cv.abbrev}" aria-hidden="true">Aa</span>
    <span style="min-width: 0;">
      <a class="row-title" th:href="${cv.post.url}" target="_blank" rel="noopener noreferrer"
         th:text="${cv.post.title != null ? cv.post.title : cv.post.url}">Title</a>
      <span class="row-sub">
        <span th:text="${cv.domain}">site.com</span> ·
        <span th:text="${#temporals.format(cv.post.createdDate, 'dd.MM.yyyy')}">01.01.2026</span><a
          th:each="label : ${cv.post.labels}" class="label-tag"
          th:href="@{/labels/{id}(id=${label.id})}"
          th:text="'#' + ${label.name}">#label</a>
      </span>
    </span>
    <span class="row-side">
      <span th:if="${pageType == 'all' or pageType == 'favorites'}"
            class="status-chip"
            th:classappend="${cv.post.isArchived} ? '' : 'on-shelf'"
            th:text="${cv.post.isArchived} ? #{web.status.archived} : #{web.status.shelf}">на полке</span>
      <div th:replace="~{fragments/post-card :: actions(${cv}, ${type}, ${pageType})}"></div>
      <div th:replace="~{fragments/post-card :: confirm(${cv}, ${type})}"></div>
      <div th:replace="~{fragments/post-card :: labelpanel(${cv}, ${type})}"></div>
    </span>
  </th:block>

</div>
</html>
