<!DOCTYPE html>
<!-- src/main/resources/templates/fragments/post-card.html -->
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Parameters:
    post : PostData
    type : "unread" | "archive"
-->
<div th:fragment="card(post, type)"
     th:id="'card-' + ${post.id}"
     class="post-card">

  <!-- ═══ LIST VIEW (display:contents → children join parent flex) ═══ -->
  <div class="card-list-view">

    <!-- Favicon -->
    <div class="post-favicon"
         th:data-url="${post.url}"
         style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 6px;
                background: var(--border); overflow: hidden;
                display: flex; align-items: center; justify-content: center;">
      <img style="width: 32px; height: 32px; display: none;" alt="">
      <span class="fav-fallback"
            style="font-size: 0.62rem; color: var(--muted); font-family: sans-serif; font-style: normal;">??</span>
    </div>

    <!-- Content -->
    <div style="flex: 1; min-width: 0;">
      <a th:href="${post.url}"
         th:text="${post.title != null ? post.title : post.url}"
         target="_blank" rel="noopener noreferrer"
         class="font-display"
         style="font-size: 1.05rem; font-weight: 600; color: var(--text);
                text-decoration: none; display: block;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
        Post Title
      </a>
      <!-- Date row + actions on the same line -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 0.15rem; padding-right: 0.4rem;">
        <p style="color: var(--muted); font-style: italic; font-size: 0.82rem; margin: 0;">
          <span th:text="${#temporals.format(post.createdDate, 'dd.MM.yyyy')}">01.01.2024</span>
        </p>
        <!-- Actions: in-flow (reserves width), confirm absolute on top -->
        <div style="position: relative; display: flex; align-items: center; flex-shrink: 0; margin-left: 0.5rem;">
          <div class="card-actions" style="gap: 0.3rem; align-items: center; white-space: nowrap;">
            <button th:if="${type == 'unread'}"
                    class="card-action-btn"
                    th:text="#{web.post.to.archive}"
                    th:attr="hx-post=@{/api/v1/posts/{id}/archive(id=${post.id})}"
                    hx-target="closest .post-card"
                    hx-swap="delete">→ Архив</button>
            <button th:if="${type == 'archive'}"
                    class="card-action-btn"
                    th:text="#{web.post.to.unread}"
                    th:attr="hx-post=@{/api/v1/posts/{id}/unread(id=${post.id})}"
                    hx-target="closest .post-card"
                    hx-swap="delete">→ Непрочитанное</button>
            <button class="card-action-btn"
                    data-fav-btn
                    th:attr="hx-post=@{/api/v1/posts/{id}/favorite(id=${post.id},type=${type})}"
                    hx-swap="none"
                    hx-on--after-request="if(event.detail.successful) toggleFavBtn(this)"
                    th:text="${post.isFavorite} ? '⭐' : '☆'">☆</button>
            <button class="card-action-btn"
                    th:attr="onclick='showDeleteConfirm(' + ${post.id} + ')'">🗑</button>
          </div>
          <div class="delete-confirm"
               style="position: absolute; inset: 0; gap: 0.4rem; align-items: center;
                      justify-content: flex-end; background: var(--bg); white-space: nowrap;">
            <span th:text="#{web.post.delete.confirm}">Удалить?</span>
            <button class="delete-confirm-yes"
                    th:text="#{web.post.delete.yes}"
                    th:attr="hx-delete=@{/api/v1/posts/{id}(id=${post.id},type=${type})}"
                    hx-target="closest .post-card"
                    hx-swap="delete">Да</button>
            <button class="delete-confirm-no"
                    th:text="#{web.post.delete.no}"
                    th:attr="onclick='hideDeleteConfirm(' + ${post.id} + ')'">Нет</button>
          </div>
        </div>
      </div>
      <div th:if="${post.tags != null and !post.tags.isEmpty()}"
           style="display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.3rem;">
        <span th:each="tag : ${post.tags}"
              th:text="'#' + ${tag}"
              style="color: var(--muted); font-size: 0.78rem;">#tag</span>
      </div>
    </div>

  </div>

  <!-- ═══ GRID VIEW ═══ -->
  <div class="card-grid-view"
       style="border: 1px solid var(--border); border-radius: 8px;
              overflow: hidden; background: var(--bg); width: 100%;">

    <!-- OG thumbnail -->
    <div class="post-og"
         th:data-id="${post.id}"
         th:data-type="${post.isArchived ? 'archive' : 'unread'}"
         th:data-url="${post.url}"
         style="aspect-ratio: 16/9; background: var(--border); overflow: hidden;
                display: flex; align-items: center; justify-content: center;">
      <img class="og-img"
           style="width: 100%; height: 100%; object-fit: cover; display: none;" alt="">
      <div class="og-fallback"
           style="display: flex; flex-direction: column; align-items: center; gap: 0.4rem;">
        <div class="post-favicon"
             th:data-url="${post.url}"
             style="width: 40px; height: 40px; border-radius: 8px; background: var(--bg);
                    display: flex; align-items: center; justify-content: center;">
          <img style="width: 40px; height: 40px; display: none;" alt="">
          <span class="fav-fallback"
                style="font-size: 0.72rem; color: var(--muted); font-family: sans-serif;">??</span>
        </div>
      </div>
    </div>

    <!-- Card body -->
    <div class="card-grid-body" style="padding: 0.65rem 0.75rem;">
      <a th:href="${post.url}"
         th:text="${post.title != null ? post.title : post.url}"
         target="_blank" rel="noopener noreferrer"
         class="font-display"
         style="font-size: 0.88rem; font-weight: 600; color: var(--text); text-decoration: none;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; line-height: 1.35;">
        Post Title
      </a>
      <!-- Date row + actions on the same line -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 0.2rem; padding-right: 0.4rem;">
        <p style="font-size: 0.72rem; color: var(--muted); font-style: italic; margin: 0;">
          <span th:text="${#temporals.format(post.createdDate, 'dd.MM.yyyy')}">01.01.2024</span>
        </p>
        <div style="position: relative; display: flex; align-items: center; flex-shrink: 0; margin-left: 0.5rem;">
          <div class="card-actions" style="gap: 0.15rem; align-items: center;">
            <button th:if="${type == 'unread'}"
                    class="card-action-btn"
                    title="В архив"
                    th:attr="hx-post=@{/api/v1/posts/{id}/archive(id=${post.id})}"
                    hx-target="closest .post-card"
                    hx-swap="delete">→</button>
            <button th:if="${type == 'archive'}"
                    class="card-action-btn"
                    title="В непрочитанные"
                    th:attr="hx-post=@{/api/v1/posts/{id}/unread(id=${post.id})}"
                    hx-target="closest .post-card"
                    hx-swap="delete">←</button>
            <button class="card-action-btn"
                    data-fav-btn
                    th:attr="hx-post=@{/api/v1/posts/{id}/favorite(id=${post.id},type=${type})}"
                    hx-swap="none"
                    hx-on--after-request="if(event.detail.successful) toggleFavBtn(this)"
                    th:text="${post.isFavorite} ? '⭐' : '☆'">☆</button>
            <button class="card-action-btn"
                    title="Удалить"
                    th:attr="onclick='showDeleteConfirm(' + ${post.id} + ')'">🗑</button>
          </div>
          <div class="delete-confirm"
               style="position: absolute; inset: 0; gap: 0.3rem; align-items: center;
                      justify-content: flex-end; background: var(--bg); white-space: nowrap;">
            <span th:text="#{web.post.delete.confirm}">Удалить?</span>
            <button class="delete-confirm-yes"
                    th:text="#{web.post.delete.yes}"
                    th:attr="hx-delete=@{/api/v1/posts/{id}(id=${post.id},type=${type})}"
                    hx-target="closest .post-card"
                    hx-swap="delete">Да</button>
            <button class="delete-confirm-no"
                    th:text="#{web.post.delete.no}"
                    th:attr="onclick='hideDeleteConfirm(' + ${post.id} + ')'">Нет</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</html>
