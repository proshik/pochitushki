<!DOCTYPE html>
<!-- src/main/resources/templates/fragments/post-card.html -->
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Parameters:
    post : PostData
    type : "unread" | "archive"
-->
<div th:fragment="card(post, type)"
     th:id="'card-' + ${post.id}"
     class="post-card"
     style="display: flex; gap: 0.75rem; align-items: flex-start;
            padding-top: 1rem; padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);">

  <!-- Favicon cell — JS fills the img src after load -->
  <div class="post-favicon"
       th:data-url="${post.url}"
       style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 6px;
              background: var(--border); overflow: hidden;
              display: flex; align-items: center; justify-content: center;">
    <img style="width: 32px; height: 32px; display: none;" alt="">
    <span class="fav-fallback"
          style="font-size: 0.62rem; color: var(--muted);
                 font-family: sans-serif; font-style: normal;">??</span>
  </div>

  <!-- Content -->
  <div style="flex: 1; min-width: 0;">

    <!-- Title -->
    <a th:href="${post.url}"
       th:text="${post.title != null ? post.title : post.url}"
       target="_blank" rel="noopener noreferrer"
       class="font-display"
       style="font-size: 1.05rem; font-weight: 600; color: var(--text);
              text-decoration: none; display: block;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      Post Title
    </a>

    <!-- Date -->
    <p style="color: var(--muted); font-style: italic; font-size: 0.82rem; margin-top: 0.15rem;">
      <span th:text="${#temporals.format(post.createdDate, 'dd.MM.yyyy')}">01.01.2024</span>
    </p>

    <!-- Tags -->
    <div th:if="${post.tags != null and !post.tags.isEmpty()}"
         style="display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.3rem;">
      <span th:each="tag : ${post.tags}"
            th:text="'#' + ${tag}"
            style="color: var(--muted); font-size: 0.78rem;">#tag</span>
    </div>

    <!-- Action buttons (shown on card hover via CSS) -->
    <div th:id="'card-actions-' + ${post.id}"
         class="card-actions"
         style="gap: 0.4rem; margin-top: 0.5rem; align-items: center;">

      <!-- Favorite toggle -->
      <button class="card-action-btn"
              th:attr="hx-post=@{/api/v1/posts/{id}/favorite(id=${post.id},type=${type})}"
              hx-target="closest .post-card"
              hx-swap="outerHTML"
              th:text="${post.isFavorite} ? '⭐' : '☆'">☆</button>

      <!-- To Archive (unread only) -->
      <button th:if="${type == 'unread'}"
              class="card-action-btn"
              th:attr="hx-post=@{/api/v1/posts/{id}/archive(id=${post.id})}"
              hx-target="closest .post-card"
              hx-swap="delete">→ Архив</button>

      <!-- To Unread (archive only) -->
      <button th:if="${type == 'archive'}"
              class="card-action-btn"
              th:attr="hx-post=@{/api/v1/posts/{id}/unread(id=${post.id})}"
              hx-target="closest .post-card"
              hx-swap="delete">→ Непрочитанное</button>

      <!-- Delete trigger — shows inline confirm, no server call here -->
      <button class="card-action-btn"
              th:attr="onclick='showDeleteConfirm(' + ${post.id} + ')'">🗑</button>
    </div>

    <!-- Inline delete confirm (hidden until 🗑 clicked) -->
    <div th:id="'delete-confirm-' + ${post.id}"
         class="delete-confirm">
      <span>Удалить?</span>
      <button class="delete-confirm-yes"
              th:attr="hx-delete=@{/api/v1/posts/{id}(id=${post.id},type=${type})}"
              hx-target="closest .post-card"
              hx-swap="delete">Да</button>
      <button class="delete-confirm-no"
              th:attr="onclick='hideDeleteConfirm(' + ${post.id} + ')'">Нет</button>
    </div>

  </div>
</div>
</html>
