<!DOCTYPE html>
<!-- src/main/resources/templates/fragments/add-post-form.html
     Lives in the top bar on every list page. Optimistic submit handled by
     initAddPostForm() in /js/app.js (CSP: no inline handlers). -->
<html xmlns:th="http://www.thymeleaf.org">

<form th:fragment="form" id="add-post-form" class="add-form"
      th:attr="data-error-text=#{web.add.error},data-adding-text=#{web.add.progress}">
  <input type="url"
         id="add-post-url"
         name="url"
         required
         th:placeholder="#{web.add.placeholder}"
         th:attr="aria-label=#{web.add.placeholder}">
  <button type="submit" th:text="#{web.add.submit}">На полку</button>
</form>
</html>
