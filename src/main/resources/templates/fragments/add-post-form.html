<!DOCTYPE html>
<!-- src/main/resources/templates/fragments/add-post-form.html -->
<html xmlns:th="http://www.thymeleaf.org">

<form th:fragment="form"
      hx-post="/api/v1/posts"
      hx-target="#post-list"
      hx-swap="afterbegin"
      hx-on--before-request="this._url=this.querySelector('input').value; this.querySelector('input').value=''; this.querySelector('input').disabled=true; this.querySelector('button').disabled=true;"
      hx-on--after-request="var inp=this.querySelector('input'); var btn=this.querySelector('button'); if(!event.detail.successful){inp.value=this._url;} inp.disabled=false; btn.disabled=false; inp.focus();"
      style="display: flex; gap: 0.75rem; margin-bottom: 2rem;">
  <input type="url"
         name="url"
         placeholder="https://..."
         required
         style="flex: 1; padding: 0.6rem 1rem; border: 1px solid var(--border);
                border-radius: 6px; background: var(--bg); color: var(--text);
                font-family: inherit; font-size: 0.95rem;">
  <button type="submit"
          th:text="#{web.form.add.button}"
          style="padding: 0.6rem 1.25rem; background: var(--accent); color: white;
                 border: none; border-radius: 6px; cursor: pointer;
                 font-family: inherit; font-size: 0.95rem;">
    Добавить
  </button>
</form>
</html>
