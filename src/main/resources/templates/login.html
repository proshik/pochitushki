<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Войти — Почитушки</title>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <!-- Anti-flash: must run before any paint, so no defer. -->
  <script src="/js/theme-init.js"></script>
  <!-- Standalone page: does not extend layout, but shares the same design system. -->
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <!-- The service's own cover: a poster for the shelf -->
      <div class="cover co-mono login-cover" aria-hidden="true">
        <span class="cover-dom">почитушки</span>
        <span class="cover-big">Чи&shy;тать</span>
        <span class="cover-cap">потом — значит здесь</span>
      </div>

      <h1>Почитушки</h1>
      <p class="login-sub" th:text="#{web.login.subtitle}">Сохраняйте и читайте статьи в удобное время</p>

      <div th:if="${param.error}" class="login-error">
        <span th:switch="${param.error[0]}">
          <span th:case="'state'" th:text="#{web.login.error.security}">Ошибка безопасности. Попробуйте ещё раз.</span>
          <span th:case="'cancelled'" th:text="#{web.login.error.cancelled}">Вход отменён.</span>
          <span th:case="'server'" th:text="#{web.login.error.server}">Ошибка сервера. Попробуйте позже.</span>
          <span th:case="*" th:text="#{web.login.error.unknown}">Произошла ошибка. Попробуйте ещё раз.</span>
        </span>
      </div>

      <a href="/auth/telegram" class="btn btn-solid">
        <span class="tg-dot" aria-hidden="true"></span>
        <span th:text="#{web.login.button}">Войти через Telegram</span>
      </a>
    </div>
  </div>
</body>
</html>
