<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Почитушки</title>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <!-- Telegram's script must come first (core.telegram.org/bots/webapps). The CSP allows
       telegram.org only on this page and in Mini App mode (SecurityHeadersFilter). -->
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <script src="/js/theme-init.js"></script>
  <script src="/js/tg-login.js" defer></script>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1 class="logo">Почитушки</h1>
    <p class="login-sub" id="tg-loading" th:text="#{web.tg.loading}">Входим…</p>
    <div id="tg-browser" hidden>
      <p class="login-sub" th:text="#{web.tg.cookies}">Telegram Web не даёт сайту запомнить вход.</p>
      <button type="button" class="btn btn-solid" id="tg-open-browser" th:text="#{web.tg.open_in_browser}">Открыть в браузере</button>
    </div>
    <div id="tg-outside" hidden>
      <p class="login-sub" th:text="#{web.tg.outside}">Эта страница открывается из Telegram.</p>
      <a class="btn btn-solid" href="/login" th:text="#{web.tg.to_login}">Войти на сайте</a>
    </div>
    <p class="login-error" id="tg-error" hidden th:text="#{web.tg.error}">Не получилось войти.</p>
  </div>
</div>
</body>
</html>
