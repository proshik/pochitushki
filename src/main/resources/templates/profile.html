<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout :: head(#{web.nav.profile})}"></head>
<body>
<header th:replace="~{layout :: topbar('profile')}"></header>
<main class="page-main" style="max-width: 760px;">

  <div class="profile-head">
    <h1 class="profile-name"
        th:text="${user.firstName != null ? user.firstName : user.username}">Name</h1>
    <span class="profile-sub"
          th:text="${user.username != null ? '@' + user.username + ' · Telegram' : 'Telegram'}">@username</span>
    <!-- Форма, а не ссылка: выход отзывает выданные токены, то есть меняет состояние. -->
    <!-- Inside Telegram the session is the Telegram account itself: no logout there. -->
    <form method="post" action="/logout" th:unless="${miniApp == true}">
      <button type="submit" class="btn btn-ghost" th:text="#{web.profile.logout}">Выйти</button>
    </form>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-n" th:text="${unreadCount}">0</div>
      <div class="stat-l" th:text="#{web.profile.stats.unread}">непрочитанных</div>
    </div>
    <div class="stat">
      <div class="stat-n" th:text="${archiveCount}">0</div>
      <div class="stat-l" th:text="#{web.profile.stats.archive}">в архиве</div>
    </div>
    <div class="stat">
      <div class="stat-n" th:text="${favoritesCount}">0</div>
      <div class="stat-l" th:text="#{web.profile.stats.favorites}">избранных</div>
    </div>
  </div>

  <!-- The bottom tabs stay at six, so this is the mobile route to label management. -->
  <a class="settings-link" href="/labels">
    <span class="settings-label" th:text="#{web.nav.labels}">Метки</span>
    <span class="settings-hint" th:text="#{web.profile.labels.hint}">Переименовать, удалить, посмотреть посты</span>
  </a>

  <div class="settings-box" hx-ext="json-enc">
    <div class="settings-row">
      <span>
        <span class="settings-label" th:text="#{web.profile.language}">Язык бота</span><br>
        <span class="settings-hint" th:text="#{web.profile.language.hint}">Влияет только на ответы бота в Telegram</span>
      </span>
      <span class="pills" id="lang-btns">
        <button type="button" class="pill"
                th:classappend="${user.settings.languageCode == 'ru'} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"languageCode":"ru"}'
                hx-swap="none"
                data-reload-on-success>RU</button>
        <button type="button" class="pill"
                th:classappend="${user.settings.languageCode == 'en'} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"languageCode":"en"}'
                hx-swap="none"
                data-reload-on-success>EN</button>
      </span>
    </div>
    <div class="settings-row">
      <span>
        <span class="settings-label" th:text="#{web.profile.og.covers}">Фото-обложки</span><br>
        <span class="settings-hint" th:text="#{web.profile.og.covers.hint}">Показывать og:image с сайтов</span>
      </span>
      <span class="pills" id="og-covers-btns">
        <button type="button" class="pill"
                th:classappend="${user.settings.showOgCovers} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"showOgCovers":true}'
                hx-swap="none"
                data-reload-on-success
                th:text="#{web.profile.toggle.on}">Вкл</button>
        <button type="button" class="pill"
                th:classappend="${!user.settings.showOgCovers} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"showOgCovers":false}'
                hx-swap="none"
                data-reload-on-success
                th:text="#{web.profile.toggle.off}">Выкл</button>
      </span>
    </div>
  </div>

</main>
<nav th:replace="~{layout :: tabs('profile')}"></nav>
</body>
</html>
