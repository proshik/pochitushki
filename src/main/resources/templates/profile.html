<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{layout :: head(#{web.nav.profile})}"></head>
<body>
<header th:replace="~{layout :: topbar('profile')}"></header>
<main class="page-main" style="max-width: 760px;">

  <div class="profile-head">
    <h1 class="profile-name"
        th:text="${user.firstName != null ? user.firstName : user.username}">Name</h1>
    <span class="profile-sub"
          th:text="${user.username != null ? '@' + user.username + ' · Telegram' : 'Telegram'}">@username</span>
    <a href="/logout" class="btn btn-ghost" th:text="#{web.profile.logout}">Выйти</a>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-n" th:text="${unreadCount}">0</div>
      <div class="stat-l" th:text="#{web.profile.stats.unread}">непрочитанных</div>
    </div>
    <div class="stat">
      <div class="stat-n" th:text="${archiveCount}">0</div>
      <div class="stat-l" th:text="#{web.profile.stats.archive}">в архиве</div>
    </div>
    <div class="stat">
      <div class="stat-n" th:text="${favoritesCount}">0</div>
      <div class="stat-l" th:text="#{web.profile.stats.favorites}">избранных</div>
    </div>
  </div>

  <div class="settings-box" hx-ext="json-enc">
    <div class="settings-row">
      <span>
        <span class="settings-label" th:text="#{web.profile.language}">Язык бота</span><br>
        <span class="settings-hint" th:text="#{web.profile.language.hint}">Влияет только на ответы бота в Telegram</span>
      </span>
      <span class="pills" id="lang-btns">
        <button type="button" class="pill"
                th:classappend="${user.settings.languageCode == 'ru'} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"languageCode":"ru"}'
                hx-swap="none"
                data-reload-on-success>RU</button>
        <button type="button" class="pill"
                th:classappend="${user.settings.languageCode == 'en'} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"languageCode":"en"}'
                hx-swap="none"
                data-reload-on-success>EN</button>
      </span>
    </div>
    <div class="settings-row">
      <span>
        <span class="settings-label" th:text="#{web.profile.feed.size}">Ссылок в ленте бота</span><br>
        <span class="settings-hint" th:text="#{web.profile.feed.size.hint}">Сколько карточек присылает /feed</span>
      </span>
      <span class="pills" id="feed-size-btns">
        <button type="button" class="pill"
                th:classappend="${user.settings.tgFeedEntriesNumber == 1} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"tgFeedEntriesNumber":1}'
                hx-swap="none"
                data-reload-on-success>1</button>
        <button type="button" class="pill"
                th:classappend="${user.settings.tgFeedEntriesNumber == 3} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"tgFeedEntriesNumber":3}'
                hx-swap="none"
                data-reload-on-success>3</button>
        <button type="button" class="pill"
                th:classappend="${user.settings.tgFeedEntriesNumber == 5} ? 'on'"
                hx-post="/api/v1/profile/settings"
                hx-vals='{"tgFeedEntriesNumber":5}'
                hx-swap="none"
                data-reload-on-success>5</button>
      </span>
    </div>
  </div>

</main>
<nav th:replace="~{layout :: tabs('profile')}"></nav>
</body>
</html>
