<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Профиль')}"></head>
<body>
<div style="display: flex; min-height: 100vh;">
  <nav th:replace="~{layout :: nav('profile')}"></nav>
  <main style="flex: 1; padding: 2.5rem; min-width: 0;">
    <h1 class="font-display" style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;"
        th:text="${user.username}">username</h1>
    <p style="color: var(--muted); margin-bottom: 2.5rem;"
       th:text="${user.firstName != null ? user.firstName : ''}">First</p>
    <div style="display: flex; gap: 3rem;">
      <div>
        <div class="font-display" style="font-size: 2.5rem; font-weight: 700;"
             th:text="${unreadCount}">0</div>
        <div style="color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem;">Непрочитанных</div>
      </div>
      <div>
        <div class="font-display" style="font-size: 2.5rem; font-weight: 700;"
             th:text="${archiveCount}">0</div>
        <div style="color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem;">В архиве</div>
      </div>
      <div>
        <div class="font-display" style="font-size: 2.5rem; font-weight: 700;"
             th:text="${favoritesCount}">0</div>
        <div style="color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem;">Избранных</div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
