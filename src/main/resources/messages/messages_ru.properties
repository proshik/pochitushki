command.start.message=Добро пожаловать! 👋 \n\nЯ ваш персональный бот для сохранения и последующего чтения сохранённых постов. Пришлите \
  ссылку в чат, чтобы начать! 📥

command.help.message=Здесь то как я могу тебе помочь! ℹ️\n\nДля сохранения страницы, просто отправь URL\nДля просмотра сохранённых \
  ссылок на посты используй команду/feed button\nВо время просмотра постов нажми "Архив" для сохранения поста в архив. Или нажми \
  `Удалить` для удаления поста из непрочитанных без сохранения в архив\nПолучи случайных пост из непрочитанных командой /random_post\nДля\
  \ просмотра архивных постов выполни команду /archive\n\n📄 Экспорт в PDF: нажми 📄 PDF на любом посте\n  ⚡ Быстрый — быстро и без JS\n  🎯 Точный — полный рендер, медленнее\n\nНужна дополнительная помочь? Просто обратись к автору в ТГ @proshik
command.start.features=📌 Что я умею:\n• Сохранять ссылки — просто отправь URL\n• /feed — список непрочитанного\n• /archive — архив постов\n• /favorites — избранное\n• /random_post — случайный пост для чтения\n\n📄 Экспорт в PDF — сохрани статью как файл:\n• ⚡ Быстрый — быстро, текст без JS (работает на большинстве сайтов)\n• 🎯 Точный — полный рендер браузера с картинками и JS (медленнее)

