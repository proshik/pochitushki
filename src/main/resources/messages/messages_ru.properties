command.start.message=Добро пожаловать! 👋 \n\nЯ ваш персональный бот для сохранения и последующего чтения сохранённых постов. Пришлите \
  ссылку в чат, чтобы начать! 📥

command.help.message=Здесь то как я могу тебе помочь! ℹ️\n\nДля сохранения страницы, просто отправь URL\nДля просмотра сохранённых \
  ссылок на посты используй команду/feed button\nВо время просмотра постов нажми "Архив" для сохранения поста в архив. Или нажми \
  `Удалить` для удаления поста из непрочитанных без сохранения в архив\nПолучи случайных пост из непрочитанных командой /random_post\nДля\
  \ просмотра архивных постов выполни команду /archive\n\nНужна дополнительная помочь? Просто обратись к автору в ТГ @proshik!

