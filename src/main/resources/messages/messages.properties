command.start.message=Welcome! 👋 \n\nI'm your personal bot for saving and reading web pages later. Just send me a link to get started! 📥

command.help.message=How can I help you? ℹ️\n\n• To save a link: Just send me the URL.\n• To view your feed: Use the /feed command.\n• To archive: Press the `Archive` button.\n• To delete: Press the `Delete` button.\n• For a random post: Use /random_post\n• For archived posts: Use /archive\n\n📄 PDF export: press 📄 PDF on any post\n  ⚡ Fast — quick and lightweight\n  🎯 Precise — full render, slower\n\nQuestions? Contact @proshik
command.start.features=📌 What I can do:\n• Save links — just send a URL\n• /feed — your reading list\n• /archive — archived posts\n• /favorites — starred posts\n• /random_post — pick something to read\n\n📄 PDF export — save any article as a file:\n• ⚡ Fast — quick, text-focused (works on most sites)\n• 🎯 Precise — full browser render with images and JS (slower)
